<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>ROBLOX DEV</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#070a11;
  color:white;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:#101521ee;
  backdrop-filter:blur(15px);
  border-bottom:1px solid #252c3b;
}

.nav{
  max-width:1200px;
  margin:auto;
  padding:14px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-size:22px;
  font-weight:900;
}

.logo span{
  color:#766cff;
}

nav{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

nav a{
  color:#aab1c0;
  text-decoration:none;
  padding:9px 12px;
  border-radius:10px;
  font-size:14px;
}

nav a:hover,
nav a.active{
  background:#766cff;
  color:white;
}

.admin{
  display:none;
  color:white;
  text-decoration:none;
  background:#191f2e;
  border:1px solid #766cff;
  padding:9px 12px;
  border-radius:10px;
  font-size:13px;
}

.hero{
  text-align:center;
  padding:75px 20px 55px;
  background:
  radial-gradient(circle at top,#302866,#070a11 65%);
}

.hero h1{
  font-size:42px;
  margin-bottom:12px;
}

.hero p{
  color:#aeb5c5;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:35px 20px;
}

.section{
  margin-bottom:45px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.section-title h2{
  font-size:25px;
}

.section-title a{
  color:#918aff;
  text-decoration:none;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.card{
  background:#111722;
  border:1px solid #272f40;
  border-radius:18px;
  overflow:hidden;
  transition:.25s;
}

.card:hover{
  transform:translateY(-5px);
  border-color:#766cff;
}

.media{
  width:100%;
  aspect-ratio:16/9;
  background:#171d29;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#6f7788;
  font-size:45px;
}

.media img,
.media video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.content{
  padding:17px;
}

.content h3{
  margin-bottom:8px;
}

.content p{
  color:#9da6b7;
  font-size:14px;
  line-height:1.5;
}

.tag{
  display:inline-block;
  margin-top:12px;
  padding:5px 9px;
  border-radius:8px;
  background:#252044;
  color:#aaa3ff;
  font-size:12px;
}

.price{
  color:#968fff;
  font-size:22px;
  font-weight:bold;
  margin:12px 0;
}

.buy{
  width:100%;
  border:0;
  padding:11px;
  border-radius:10px;
  background:#766cff;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.empty{
  border:1px dashed #343c4d;
  padding:25px;
  text-align:center;
  color:#727c90;
  border-radius:15px;
}

footer{
  text-align:center;
  color:#687286;
  padding:35px 20px;
  border-top:1px solid #222938;
}

@media(max-width:850px){
  .grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:560px){
  .nav{
    flex-wrap:wrap;
  }

  .hero h1{
    font-size:30px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  nav a{
    font-size:12px;
    padding:8px;
  }
}
</style>
</head>

<body>

<header>

<div class="nav">

<div class="logo">
ROBLOX<span>DEV</span>
</div>

<nav>
<a href="index.html" class="active">หน้าหลัก</a>
<a href="teaching.html">สื่อการสอน</a>
<a href="shop.html">ร้านค้า</a>
</nav>

<a id="adminButton" class="admin" href="admin.html">
⚙️ ADMIN
</a>

</div>

</header>


<section class="hero">

<h1>ROBLOX DEVELOPMENT</h1>

<p>
Script • Model • UI • System • Tutorial • Portfolio
</p>

</section>


<main class="container">


<section class="section">

<div class="section-title">
<h2>🎬 วิดีโอทั้งหมด</h2>
<a href="teaching.html">ดูทั้งหมด →</a>
</div>

<div id="videos" class="grid"></div>

</section>



<section class="section">

<div class="section-title">
<h2>🛒 สินค้าล่าสุด</h2>
<a href="shop.html">ดูร้านค้า →</a>
</div>

<div id="products" class="grid"></div>

</section>



<section class="section">

<div class="section-title">

<h2>🏆 ผลงานล่าสุด</h2>

</div>

<div id="works" class="grid"></div>

</section>


</main>


<footer>

© 2026 ROBLOX DEV

</footer>


<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
getAuth,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
getFirestore,
collection,
query,
orderBy,
limit,
onSnapshot
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

import {
firebaseConfig,
ADMIN_EMAIL
}
from "./firebase-config.js";


const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);


onAuthStateChanged(auth,user=>{

if(
user &&
user.email.toLowerCase()===ADMIN_EMAIL.toLowerCase()
){

document.getElementById("adminButton").style.display="block";

}

});


function escapeHTML(text){

return String(text || "")
.replace(/[&<>"']/g,function(char){

return {

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[char];

});

}


function watchCollection(name,id,render){

const q=query(
collection(db,name),
orderBy("createdAt","desc"),
limit(20)
);

onSnapshot(q,snapshot=>{

const element=document.getElementById(id);

if(snapshot.empty){

element.innerHTML=
'<div class="empty">ยังไม่มีข้อมูล</div>';

return;

}

element.innerHTML=snapshot.docs
.map(doc=>render(doc.data()))
.join("");

});

}



watchCollection(
"videos",
"videos",
data=>`

<article class="card">

<div class="media">

${
data.url
?
`<video controls playsinline src="${escapeHTML(data.url)}"></video>`
:
"▶️"
}

</div>

<div class="content">

<h3>${escapeHTML(data.title)}</h3>

<p>${escapeHTML(data.description)}</p>

<span class="tag">
${escapeHTML(data.category || "Video")}
</span>

</div>

</article>

`
);



watchCollection(
"products",
"products",
data=>`

<article class="card">

<div class="media">

${
data.image
?
`<img src="${escapeHTML(data.image)}">`
:
"🧩"
}

</div>

<div class="content">

<h3>${escapeHTML(data.title)}</h3>

<p>${escapeHTML(data.description)}</p>

<span class="tag">
${escapeHTML(data.category || "สินค้า")}
</span>

<div class="price">
฿${escapeHTML(data.price || 0)}
</div>

<button
class="buy"
onclick="location.href='mailto:mokll008001@gmail.com?subject='+encodeURIComponent('สั่งซื้อ ${escapeHTML(data.title)}')">

สั่งซื้อ

</button>

</div>

</article>

`
);



watchCollection(
"works",
"works",
data=>`

<article class="card">

<div class="media">

${
data.image
?
`<img src="${escapeHTML(data.image)}">`
:
"🏆"
}

</div>

<div class="content">

<h3>${escapeHTML(data.title)}</h3>

<p>${escapeHTML(data.description)}</p>

</div>

</article>

`
);

</script>

</body>
</html>
