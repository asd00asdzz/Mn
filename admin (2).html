<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin | ROBLOX DEV</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#070a11;
  color:white;
  min-height:100vh;
}

header{
  background:#101522;
  padding:18px;
  border-bottom:1px solid #252c3a;
}

header h1{
  font-size:22px;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.nav{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.nav button{
  background:#1b2333;
  color:white;
  border:0;
  padding:11px 16px;
  border-radius:10px;
  cursor:pointer;
}

.nav button.active{
  background:#5865f2;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.box{
  background:#101522;
  border:1px solid #252c3a;
  border-radius:15px;
  padding:20px;
  margin-bottom:20px;
}

.box h2{
  margin-bottom:15px;
}

input,
textarea,
select{
  width:100%;
  padding:12px;
  margin:6px 0 12px;
  background:#080d17;
  color:white;
  border:1px solid #30394a;
  border-radius:9px;
  outline:none;
}

textarea{
  min-height:100px;
  resize:vertical;
}

button{
  cursor:pointer;
}

.main-btn{
  background:#5865f2;
  color:white;
  border:0;
  padding:12px 18px;
  border-radius:9px;
}

.delete-btn{
  background:#d9363e;
  color:white;
  border:0;
  padding:9px 14px;
  border-radius:8px;
}

.approve-btn{
  background:#16a34a;
  color:white;
  border:0;
  padding:9px 14px;
  border-radius:8px;
}

.deny-btn{
  background:#d97706;
  color:white;
  border:0;
  padding:9px 14px;
  border-radius:8px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:15px;
}

.item{
  background:#0b111d;
  border:1px solid #252c3a;
  border-radius:13px;
  padding:15px;
}

.item img,
.item video{
  width:100%;
  max-height:260px;
  object-fit:cover;
  border-radius:9px;
  margin-bottom:10px;
}

.item h3{
  margin-bottom:8px;
}

.item p{
  color:#b8c0ce;
  margin-bottom:8px;
}

.status{
  padding:10px;
  border-radius:8px;
  background:#172033;
  margin-top:10px;
}

label{
  display:block;
  margin-bottom:5px;
  color:#d7dce5;
}

.file-box{
  background:#0b111d;
  border:1px dashed #39455a;
  padding:12px;
  border-radius:9px;
  margin-bottom:10px;
}

.small{
  font-size:13px;
  color:#9ca3af;
}

.top-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

@media(max-width:600px){
  .container{
    padding:12px;
  }

  header h1{
    font-size:19px;
  }
}
</style>
</head>

<body>

<header>
  <div class="container">
    <div class="top-title">
      <h1>⚙️ ROBLOX DEV — ADMIN</h1>
      <span id="adminEmail" class="small"></span>
    </div>
  </div>
</header>

<div class="container">

  <div class="nav">
    <button class="active" onclick="showPage('productsPage',this)">
      📦 จัดการสินค้า
    </button>

    <button onclick="showPage('clipsPage',this)">
      🎬 จัดการคลิป
    </button>

    <button onclick="showPage('usersPage',this)">
      👥 สมาชิก
    </button>

    <button onclick="showPage('notificationsPage',this)">
      🔔 แจ้งเตือน
    </button>
  </div>

  <!-- =========================
       PAGE 1 : PRODUCTS
  ========================== -->

  <section id="productsPage" class="page active">

    <div class="box">

      <h2>➕ เพิ่มสินค้า</h2>

      <input
        id="productName"
        type="text"
        placeholder="ชื่อสินค้า"
      >

      <textarea
        id="productDescription"
        placeholder="รายละเอียดสินค้า"
      ></textarea>

      <input
        id="productPrice"
        type="text"
        placeholder="ราคา เช่น 500"
      >

      <input
        id="productLine"
        type="text"
        placeholder="LINE"
      >

      <input
        id="productFacebook"
        type="text"
        placeholder="Facebook"
      >

      <input
        id="productDiscord"
        type="text"
        placeholder="Discord"
      >

      <div class="file-box">
        <label>🖼️ รูปสินค้า</label>
        <input
          id="productImage"
          type="file"
          accept="image/*"
        >
      </div>

      <div class="file-box">
        <label>🎥 วิดีโอสินค้า</label>
        <input
          id="productVideo"
          type="file"
          accept="video/*"
        >
      </div>

      <div class="file-box">
        <label>🧊 โมเดล 3D</label>
        <input
          id="productModel"
          type="file"
        >
        <div class="small">
          แนะนำ GLB / GLTF สำหรับนำไปแสดงบนเว็บไซต์
        </div>
      </div>

      <button
        class="main-btn"
        onclick="addProduct()"
      >
        เพิ่มสินค้า
      </button>

      <div id="productMessage" class="status"></div>

    </div>

    <div class="box">

      <h2>📦 สินค้าทั้งหมด</h2>

      <div
        id="productsList"
        class="grid"
      ></div>

    </div>

  </section>


  <!-- =========================
       PAGE 2 : CLIPS
  ========================== -->

  <section id="clipsPage" class="page">

    <div class="box">

      <h2>🎬 เพิ่มคลิป</h2>

      <input
        id="clipTitle"
        type="text"
        placeholder="ชื่อคลิป"
      >

      <textarea
        id="clipDescription"
        placeholder="รายละเอียดคลิป"
      ></textarea>

      <select id="clipCategory">
        <option value="คลิปโปรโมทสินค้า">
          คลิปโปรโมทสินค้า
        </option>

        <option value="สื่อการสอน">
          สื่อการสอน
        </option>

        <option value="คลิปทั่วไป">
          คลิปทั่วไป
        </option>
      </select>

      <select id="clipProduct">
        <option value="">
          -- เลือกสินค้า สำหรับคลิปโปรโมท --
        </option>
      </select>

      <div class="file-box">
        <label>🎥 ไฟล์วิดีโอ</label>
        <input
          id="clipVideo"
          type="file"
          accept="video/*"
        >
      </div>

      <div class="file-box">
        <label>🖼️ รูปปกคลิป</label>
        <input
          id="clipCover"
          type="file"
          accept="image/*"
        >
      </div>

      <button
        class="main-btn"
        onclick="addClip()"
      >
        เพิ่มคลิป
      </button>

      <div id="clipMessage" class="status"></div>

    </div>

    <div class="box">

      <h2>🎬 คลิปทั้งหมด</h2>

      <div
        id="clipsList"
        class="grid"
      ></div>

    </div>

  </section>


  <!-- =========================
       PAGE 3 : USERS
  ========================== -->

  <section id="usersPage" class="page">

    <div class="box">

      <h2>👥 คำขอเข้าสื่อการสอน</h2>

      <div
        id="usersList"
        class="grid"
      ></div>

    </div>

  </section>


  <!-- =========================
       PAGE 4 : NOTIFICATIONS
  ========================== -->

  <section id="notificationsPage" class="page">

    <div class="box">

      <h2>🔔 การแจ้งเตือน</h2>

      <div
        id="notificationsList"
        class="grid"
      ></div>

    </div>

  </section>

</div>

<!-- ส่วนที่ 2 ให้นำมาต่อจากตรงนี้ -->
<script type="module">
import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  deleteDoc,
  doc,
  onSnapshot,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  getStorage,
  ref,
  uploadBytes,
  getDownloadURL,
  deleteObject
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

import {
  firebaseConfig,
  ADMIN_EMAIL
} from "./firebase-config.js";


/* =========================
   FIREBASE
========================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);


/* =========================
   ADMIN LOGIN
========================= */

onAuthStateChanged(auth, user => {

  if (!user || user.email !== ADMIN_EMAIL) {

    document.body.innerHTML = `
      <div style="
        padding:40px;
        text-align:center;
        font-family:Arial;
        color:white;
        background:#070a11;
        min-height:100vh;
      ">
        <h2>🚫 ไม่มีสิทธิ์เข้าหน้าแอดมิน</h2>
        <p>เฉพาะบัญชีแอดมินเท่านั้น</p>
      </div>
    `;

    return;
  }

  document.body.style.display = "block";

  const emailBox = document.getElementById("adminEmail");

  if (emailBox) {
    emailBox.textContent = user.email;
  }

});


/* =========================
   เปลี่ยนหน้า
========================= */

window.showPage = function(pageId, button){

  document.querySelectorAll(".page")
    .forEach(page => page.classList.remove("active"));

  document.querySelectorAll(".nav button")
    .forEach(btn => btn.classList.remove("active"));

  document.getElementById(pageId)
    .classList.add("active");

  button.classList.add("active");

};


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

  return String(value || "")
    .replace(/[&<>"']/g, char => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[char]));

}


/* =========================
   UPLOAD FILE
========================= */

async function uploadFile(file, path){

  if(!file) return null;

  const fileRef = ref(storage, path);

  await uploadBytes(fileRef, file);

  const url = await getDownloadURL(fileRef);

  return {
    url:url,
    path:fileRef.fullPath
  };

}


/* =========================
   ADD PRODUCT
========================= */

window.addProduct = async function(){

  const message =
    document.getElementById("productMessage");

  try{

    message.textContent =
      "⏳ กำลังอัปโหลดไฟล์...";


    const productId =
      crypto.randomUUID();


    /* รูป */

    const image =
      await uploadFile(
        document.getElementById("productImage").files[0],
        `products/images/${productId}`
      );


    /* วิดีโอ */

    const video =
      await uploadFile(
        document.getElementById("productVideo").files[0],
        `products/videos/${productId}`
      );


    /* โมเดล */

    const model =
      await uploadFile(
        document.getElementById("productModel").files[0],
        `products/models/${productId}`
      );


    /* บันทึก Firestore */

    await addDoc(
      collection(db,"products"),
      {

        name:
          document.getElementById("productName").value,

        description:
          document.getElementById("productDescription").value,

        price:
          document.getElementById("productPrice").value,

        line:
          document.getElementById("productLine").value,

        facebook:
          document.getElementById("productFacebook").value,

        discord:
          document.getElementById("productDiscord").value,


        image:
          image?.url || "",

        imagePath:
          image?.path || "",


        video:
          video?.url || "",

        videoPath:
          video?.path || "",


        model3d:
          model?.url || "",

        modelPath:
          model?.path || "",


        createdAt:
          serverTimestamp()

      }
    );


    message.textContent =
      "✅ เพิ่มสินค้าเรียบร้อยแล้ว";


    /* ล้างฟอร์ม */

    document
      .querySelectorAll(
        "#productsPage input, #productsPage textarea"
      )
      .forEach(input => {

        input.value = "";

      });


  }catch(error){

    console.error(error);

    message.textContent =
      "❌ เกิดข้อผิดพลาด: " + error.message;

  }

};


/* =========================
   LOAD PRODUCTS
========================= */

onSnapshot(
  collection(db,"products"),
  snapshot => {

    const list =
      document.getElementById("productsList");


    if(snapshot.empty){

      list.innerHTML =
        "<p>ยังไม่มีสินค้า</p>";

      updateProductSelect([]);

      return;

    }


    const products =
      snapshot.docs.map(item => ({

        id:item.id,
        ...item.data()

      }));


    updateProductSelect(products);


    list.innerHTML =
      products.map(product => {

        return `

          <div class="item">

            ${
              product.image

              ? `
                <img
                  src="${product.image}"
                  alt="สินค้า"
                >
              `
              : ""
            }


            <h3>
              ${escapeHTML(product.name)}
            </h3>


            <p>
              ${escapeHTML(product.description)}
            </p>


            <p>
              💰 ราคา:
              ${escapeHTML(product.price)}
              บาท
            </p>


            ${
              product.video

              ? `
                <video
                  controls
                  src="${product.video}"
                ></video>
              `
              : ""
            }


            ${
              product.model3d

              ? `
                <p>
                  🧊 มีโมเดล 3D
                </p>
              `
              : ""
            }


            ${
              product.line

              ? `
                <p>
                  LINE:
                  ${escapeHTML(product.line)}
                </p>
              `
              : ""
            }


            ${
              product.facebook

              ? `
                <p>
                  Facebook:
                  ${escapeHTML(product.facebook)}
                </p>
              `
              : ""
            }


            ${
              product.discord

              ? `
                <p>
                  Discord:
                  ${escapeHTML(product.discord)}
                </p>
              `
              : ""
            }


            <button
              class="delete-btn"
              onclick="deleteProduct('${product.id}')"
            >
              🗑️ ลบสินค้า
            </button>

          </div>

        `;

      }).join("");

  }
);


/* =========================
   PRODUCT SELECT
========================= */

function updateProductSelect(products){

  const select =
    document.getElementById("clipProduct");


  select.innerHTML = `

    <option value="">
      -- เลือกสินค้า สำหรับโปรโมท --
    </option>

  `;


  products.forEach(product => {

    const option =
      document.createElement("option");

    option.value =
      product.id;

    option.textContent =
      product.name || "สินค้า";

    select.appendChild(option);

  });

}


/* =========================
   DELETE PRODUCT
========================= */

window.deleteProduct = async function(id){

  if(!confirm("ต้องการลบสินค้านี้ใช่หรือไม่?")){
    return;
  }


  try{

    await deleteDoc(
      doc(db,"products",id)
    );


    alert("✅ ลบสินค้าแล้ว");


  }catch(error){

    alert(
      "❌ ลบไม่สำเร็จ: "
      + error.message
    );

  }

};


/* =========================
   ส่วนที่ 3
   ระบบคลิป / สมาชิก / แจ้งเตือน
========================= */
/* =========================
   ADD CLIP
========================= */

window.addClip = async function(){

  const message =
    document.getElementById("clipMessage");

  try{

    message.textContent =
      "⏳ กำลังอัปโหลดคลิป...";


    const title =
      document.getElementById("clipTitle").value;

    const description =
      document.getElementById("clipDescription").value;

    const category =
      document.getElementById("clipCategory").value;

    const productId =
      document.getElementById("clipProduct").value;


    let collectionName;
    let storageFolder;
    let page;


    if(category === "สื่อการสอน"){

      collectionName = "videos";
      storageFolder = "teachingVideos";
      page = "teaching.html";

    }
    else if(category === "คลิปโปรโมทสินค้า"){

      collectionName = "productVideos";
      storageFolder = "productVideos";
      page = "shop.html";

    }
    else{

      collectionName = "generalVideos";
      storageFolder = "generalVideos";
      page = "index.html";

    }


    const clipId =
      crypto.randomUUID();


    const video =
      await uploadFile(
        document.getElementById("clipVideo").files[0],
        `${storageFolder}/files/${clipId}`
      );


    const cover =
      await uploadFile(
        document.getElementById("clipCover").files[0],
        `${storageFolder}/covers/${clipId}`
      );


    let productTitle = "";


    if(productId){

      const option =
        document.querySelector(
          `#clipProduct option[value="${productId}"]`
        );

      if(option){
        productTitle =
          option.textContent;
      }

    }


    await addDoc(
      collection(db,collectionName),
      {

        title:title,

        description:description,

        category:category,

        url:
          video?.url || "",

        video:
          video?.url || "",

        videoPath:
          video?.path || "",

        cover:
          cover?.url || "",

        coverPath:
          cover?.path || "",

        productId:
          category === "คลิปโปรโมทสินค้า"
          ? productId
          : "",

        productTitle:
          category === "คลิปโปรโมทสินค้า"
          ? productTitle
          : "",

        createdAt:
          serverTimestamp()

      }
    );


    /* สร้างแจ้งเตือน */

    await addDoc(
      collection(db,"notifications"),
      {

        message:
          `เพิ่ม${category}: ${title}`,

        page:page,

        createdAt:
          serverTimestamp()

      }
    );


    message.textContent =
      "✅ เพิ่มคลิปเรียบร้อยแล้ว";


    document.getElementById("clipTitle").value="";
    document.getElementById("clipDescription").value="";
    document.getElementById("clipVideo").value="";
    document.getElementById("clipCover").value="";
    document.getElementById("clipProduct").value="";


  }catch(error){

    console.error(error);

    message.textContent =
      "❌ เกิดข้อผิดพลาด: "
      + error.message;

  }

};


/* =========================
   LOAD CLIPS
========================= */

let allClips = [];


function renderClips(){

  const list =
    document.getElementById("clipsList");


  if(allClips.length === 0){

    list.innerHTML =
      "<p>ยังไม่มีคลิป</p>";

    return;

  }


  list.innerHTML =
    allClips.map(item => {

      const x = item.data;


      return `

        <div class="item">

          ${
            x.cover

            ? `
              <img
                src="${x.cover}"
                alt="ปกคลิป"
              >
            `
            : ""
          }


          <h3>
            ${escapeHTML(x.title)}
          </h3>


          <p>
            ประเภท:
            ${escapeHTML(x.category)}
          </p>


          ${
            x.productTitle

            ? `
              <p>
                สินค้า:
                ${escapeHTML(x.productTitle)}
              </p>
            `
            : ""
          }


          ${
            x.description

            ? `
              <p>
                ${escapeHTML(x.description)}
              </p>
            `
            : ""
          }


          ${
            x.url || x.video

            ? `
              <video
                controls
                src="${x.url || x.video}"
              ></video>
            `
            : ""
          }


          <button
            class="delete-btn"
            onclick="
              deleteClip(
                '${item.collection}',
                '${item.id}'
              )
            "
          >
            🗑️ ลบคลิป
          </button>

        </div>

      `;

    }).join("");

}


/* =========================
   WATCH CLIPS
========================= */

function watchClipCollection(collectionName){

  onSnapshot(
    collection(db,collectionName),
    snapshot => {

      allClips =
        allClips.filter(
          x =>
            x.collection !== collectionName
        );


      snapshot.docs.forEach(d => {

        allClips.push({

          id:d.id,

          collection:
            collectionName,

          data:d.data()

        });

      });


      allClips.sort((a,b)=>{

        const at =
          a.data.createdAt?.seconds || 0;

        const bt =
          b.data.createdAt?.seconds || 0;

        return bt-at;

      });


      renderClips();

    }
  );

}


watchClipCollection("videos");

watchClipCollection("productVideos");

watchClipCollection("generalVideos");


/* =========================
   DELETE CLIP
========================= */

window.deleteClip =
async function(collectionName,id){

  if(
    !confirm(
      "ต้องการลบคลิปนี้ใช่หรือไม่?"
    )
  ){
    return;
  }


  try{

    await deleteDoc(
      doc(
        db,
        collectionName,
        id
      )
    );


    alert("✅ ลบคลิปแล้ว");


  }catch(error){

    alert(
      "❌ ลบไม่สำเร็จ: "
      + error.message
    );

  }

};


/* =========================
   ACCESS REQUESTS
========================= */

onSnapshot(
  collection(db,"accessRequests"),
  snapshot => {

    const list =
      document.getElementById("usersList");


    if(snapshot.empty){

      list.innerHTML =
        "<p>ยังไม่มีคำขอ</p>";

      return;

    }


    list.innerHTML =
      snapshot.docs.map(d => {

        const x =
          d.data();


        return `

          <div class="item">

            <h3>
              👤
              ${escapeHTML(
                x.email ||
                x.uid ||
                "ไม่ทราบบัญชี"
              )}
            </h3>


            <p>
              UID:
              ${escapeHTML(x.uid)}
            </p>


            <p>
              สถานะ:
              <b>
                ${escapeHTML(x.status)}
              </b>
            </p>


            <button
              class="approve-btn"
              onclick="
                updateUserStatus(
                  '${d.id}',
                  'approved'
                )
              "
            >
              ✅ อนุมัติ
            </button>


            <button
              class="deny-btn"
              onclick="
                updateUserStatus(
                  '${d.id}',
                  'denied'
                )
              "
            >
              ❌ ปฏิเสธ
            </button>


            <button
              class="delete-btn"
              onclick="
                updateUserStatus(
                  '${d.id}',
                  'revoked'
                )
              "
            >
              🚫 ยกเลิกสิทธิ์
            </button>

          </div>

        `;

      }).join("");

  }
);


/* =========================
   UPDATE USER STATUS
========================= */

window.updateUserStatus =
async function(id,status){

  try{

    await updateDoc(
      doc(
        db,
        "accessRequests",
        id
      ),
      {
        status:status
      }
    );


    alert(
      status === "approved"
      ? "✅ อนุมัติแล้ว"
      : status === "denied"
      ? "❌ ปฏิเสธแล้ว"
      : "🚫 ยกเลิกสิทธิ์แล้ว"
    );


  }catch(error){

    alert(
      "เกิดข้อผิดพลาด: "
      + error.message
    );

  }

};


/* =========================
   NOTIFICATIONS
========================= */

onSnapshot(
  collection(db,"notifications"),
  snapshot => {

    const list =
      document.getElementById(
        "notificationsList"
      );


    if(snapshot.empty){

      list.innerHTML =
        "<p>ไม่มีการแจ้งเตือน</p>";

      return;

    }


    list.innerHTML =
      snapshot.docs.map(d => {

        const x =
          d.data();


        return `

          <div class="item">

            <h3>
              🔔
              ${escapeHTML(
                x.message
              )}
            </h3>


            <p>
              หน้า:
              ${escapeHTML(
                x.page
              )}
            </p>


            <button
              class="delete-btn"
              onclick="
                deleteNotification(
                  '${d.id}'
                )
              "
            >
              🗑️ ลบ
            </button>

          </div>

        `;

      }).join("");

  }
);


/* =========================
   DELETE NOTIFICATION
========================= */

window.deleteNotification =
async function(id){

  try{

    await deleteDoc(
      doc(
        db,
        "notifications",
        id
      )
    );

  }catch(error){

    alert(
      "ลบแจ้งเตือนไม่สำเร็จ: "
      + error.message
    );

  }

};

</script>
