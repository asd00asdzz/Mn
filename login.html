<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>เข้าสู่ระบบ</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#070a11;
  color:white;
  font-family:Arial,sans-serif;
}

.box{
  width:min(92%,430px);
  background:#111722;
  border:1px solid #293144;
  border-radius:20px;
  padding:30px;
  text-align:center;
}

h1{
  margin-top:0;
}

button{
  width:100%;
  padding:14px;
  margin-top:15px;
  border:0;
  border-radius:10px;
  background:white;
  color:#222;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

.status{
  margin-top:20px;
  line-height:1.6;
}

.wait{
  color:#ffd166;
}

.ok{
  color:#6ee7a1;
}

.no{
  color:#ff7373;
}

a{
  display:block;
  margin-top:20px;
  color:#aaa3ff;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="box">

<h1>🔐 เข้าสู่ระบบ</h1>

<p>
เข้าสู่ระบบด้วย Google<br>
เพื่อขอสิทธิ์เข้าใช้งานหน้าสอน Roblox
</p>

<button id="googleBtn">
  🔵 เข้าสู่ระบบด้วย Google
</button>

<div id="status" class="status"></div>

<a href="index.html">
← กลับหน้าหลัก
</a>

</div>


<script type="module">

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged,
  signOut
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

import {
  firebaseConfig
}
from "./firebase-config.js";


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);

const provider =
new GoogleAuthProvider();


const googleBtn =
document.getElementById("googleBtn");

const status =
document.getElementById("status");


googleBtn.onclick = async () => {

  try {

    googleBtn.disabled = true;

    status.innerHTML =
      "กำลังเข้าสู่ระบบ...";

    await signInWithPopup(
      auth,
      provider
    );

  } catch(error) {

    console.error(error);

    googleBtn.disabled = false;

    status.innerHTML =
      "<span class='no'>เข้าสู่ระบบไม่สำเร็จ</span>";

  }

};


onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      googleBtn.disabled = false;

      return;

    }


    try {

      const ref =
        doc(
          db,
          "accessRequests",
          user.uid
        );


      const snap =
        await getDoc(ref);


      if(!snap.exists()){

        await setDoc(
          ref,
          {
            uid:user.uid,

            email:user.email || "",

            displayName:
              user.displayName || "",

            photoURL:
              user.photoURL || "",

            status:"pending",

            createdAt:
              serverTimestamp(),

            updatedAt:
              serverTimestamp()
          }
        );


        status.innerHTML =
          "<span class='wait'>" +
          "ส่งคำขอเรียบร้อยแล้ว ⏳<br>" +
          "กรุณารอแอดมินอนุมัติ" +
          "</span>";

        return;

      }


      const data =
        snap.data();


      if(data.status === "approved"){

        status.innerHTML =
          "<span class='ok'>" +
          "ได้รับอนุมัติแล้ว ✓<br>" +
          "กำลังเข้าสู่หน้าสอน..." +
          "</span>";


        setTimeout(() => {

          location.href =
            "teaching.html";

        },1000);


        return;

      }


      if(data.status === "denied"){

        status.innerHTML =
          "<span class='no'>" +
          "คำขอของคุณถูกปฏิเสธ ❌" +
          "</span>";

        await signOut(auth);

        googleBtn.disabled = false;

        return;

      }


      status.innerHTML =
        "<span class='wait'>" +
        "⏳ กำลังรอแอดมินอนุมัติ..." +
        "</span>";


      googleBtn.disabled = false;

    } catch(error) {

      console.error(error);

      status.innerHTML =
        "<span class='no'>" +
        "เกิดข้อผิดพลาดในการตรวจสอบสิทธิ์" +
        "</span>";

      googleBtn.disabled = false;

    }

  }
);

</script>

</body>
</html>
