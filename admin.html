<style>
*{

body{

    color:#fff;

.container{

header{

    padding:18px;

}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));

input,
textarea,
select{
    width:100%;
    padding:11px;

}

textarea{

}

button{
    border:0;
    border-radius:9px;
    padding:10px 14px;
    background:#5865f2;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.danger{
    background:#dc3545;
}

.success{
    background:#16a34a;
}

.warning{
    background:#d97706;
}

.small{
    font-size:13px;
    color:#94a3b8;
}

.item{
    background:#111827;
    border:1px solid #273044;
    border-radius:12px;
    padding:14px;
    margin:10px 0;
}

.badge{

    background:#26324d;
    padding:5px 8px;
    border-radius:7px;
    font-size:12px;
    margin-bottom:8px;
}

#app{
    display:none;
}

#loginBox{
    max-width:420px;
    margin:80px auto;
    text-align:center;
}

/* =========================
   NOTIFICATION
========================= */

#noticeBtn{
    position:relative;
    background:#20283a;
}

#noticeCount{
    position:absolute;
    right:-6px;
    top:-7px;

    background:#ef4444;

    border-radius:50%;

    min-width:20px;
    height:20px;

    display:none;

    align-items:center;
    justify-content:center;

    font-size:11px;
}

#noticePanel{
    display:none;

    position:fixed;

    right:20px;
    top:70px;

    width:min(430px,calc(100vw - 40px));

    max-height:70vh;

    overflow:auto;

    background:#0e1320;

    border:1px solid #334155;

    border-radius:14px;

    padding:14px;

    z-index:100;

    box-shadow:0 20px 60px #000;
}

.notice{
    padding:12px;
    border-bottom:1px solid #273044;
}

.notice:last-child{
    border-bottom:0;
}

.noticeMeta{
    font-size:12px;
    color:#94a3b8;
    margin-top:5px;
}

.noticeUnread{
    border-left:3px solid #5865f2;
}

</style>
</head>

<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";


import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
onAuthStateChanged,
signOut
}
from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";


import {
getFirestore,
collection,
addDoc,
doc,
updateDoc,
deleteDoc,
onSnapshot,
query,
orderBy,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";


import {
firebaseConfig,
ADMIN_EMAIL
}
from "./firebase-config.js";



/* =========================
   FIREBASE
========================= */

const app =
initializeApp(firebaseConfig);


const auth =
getAuth(app);


const db =
getFirestore(app);


const provider =
new GoogleAuthProvider();



/* =========================
   HELPER
========================= */

const $ =
id =>
document.getElementById(id);


const esc =
s =>
String(s ?? "")
.replace(
/[&<>"']/g,
c =>
({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[c])
);



let products = [];

let notices = [];

let noticeUnsub = null;



/* =========================
   TIME
========================= */

function formatTime(timestamp){

if(
!timestamp ||
!timestamp.toDate
){

return "เมื่อสักครู่";

}

return timestamp
.toDate()
.toLocaleString(
"th-TH",
{
dateStyle:"short",
timeStyle:"short"
}
);

}



/* =========================
   CREATE NOTIFICATION
========================= */

async function createNotification(
title,
detail,
page
){

await addDoc(
collection(
db,
"notifications"
),
{

title:title,

detail:detail,

page:page,

read:false,

createdBy:
auth.currentUser?.email || "",

createdAt:
serverTimestamp()

}

);



}



/* =========================
   LOAD NOTIFICATIONS
========================= */

function listenNotifications(){

if(noticeUnsub){

noticeUnsub();

}


const q =
query(
collection(db,"notifications"),
orderBy(
"createdAt",
"desc"
)
);


noticeUnsub =
onSnapshot(
q,
snapshot => {

notices =
snapshot.docs
.map(
d => ({
id:d.id,
...d.data()
})
)
.slice(0,50);


renderNotifications();

}
);

}



/* =========================
   RENDER NOTIFICATIONS
========================= */

function renderNotifications(){

const box =
$("noticeList");


if(!notices.length){

box.innerHTML =
`
<div class="small">
ยังไม่มีแจ้งเตือน
</div>
`;

}
else{

box.innerHTML =
notices
.map(
n => `

<div
class="notice
${n.read ? "" : "noticeUnread"}"
>

<b>
${esc(n.title)}
</b>

<div style="margin-top:5px">
${esc(n.detail)}
</div>

<div class="noticeMeta">

📍 หน้า:
${esc(n.page)}

<br>

🕐
${formatTime(n.createdAt)}

</div>


<button
class="openNotice"
data-id="${n.id}"
style="
margin-top:8px;
padding:7px 10px;
"
>

เปิดหน้า

</button>


</div>

`
)
.join("");

}



const unread =
notices.filter(
n => !n.read
).length;


const count =
$("noticeCount");


count.textContent =
unread;


count.style.display =
unread
? "inline-flex"
: "none";

}



/* =========================
   NOTICE BUTTON
========================= */

$("noticeBtn").onclick =
() => {

const panel =
$("noticePanel");


panel.style.display =
panel.style.display === "block"
? "none"
: "block";

};



/* =========================
   READ ALL
========================= */

$("readAllBtn").onclick =
async () => {

const unread =
notices.filter(
n => !n.read
);


for(
const n of unread
){

await updateDoc(
doc(
db,
"notifications",
n.id
),
{
read:true
}
);

}

};



/* =========================
   OPEN NOTICE
========================= */

$("noticeList").onclick =
async e => {

if(
!e.target.classList
.contains("openNotice")
){

return;

}


const id =
e.target.dataset.id;


const n =
notices.find(
x => x.id === id
);


if(!n){

return;

}


if(!n.read){

await updateDoc(
doc(
db,
"notifications",
n.id
),
{
read:true
}
);

}


$("noticePanel").style.display =
"none";


if(
n.page === "สินค้า"
){

location.hash =
"#products";

}


else if(
n.page === "คลิปโปรโมทสินค้า"
){

location.hash =
"#videos";

}


else if(
n.page === "สื่อการสอน"
){

location.hash =
"#videos";

}


else if(
n.page === "คลิปทั่วไป"
){

location.hash =
"#videos";

}

};



/* =========================
   LOGIN
========================= */

$("loginBtn").onclick =
async () => {

try{

const result =
await signInWithPopup(
auth,
provider
);


if(
result.user.email !==
ADMIN_EMAIL
){

await signOut(auth);

$("loginMsg").textContent =
"บัญชีนี้ไม่มีสิทธิ์แอดมิน";

}

}

catch(error){

$("loginMsg").textContent =
"เข้าสู่ระบบไม่สำเร็จ: "
+
error.message;

}

};



/* =========================
   LOGOUT
========================= */

$("logoutBtn").onclick =
() =>
signOut(auth);



/* =========================
   AUTH
========================= */

onAuthStateChanged(
auth,
user => {

if(!user){

$("loginBox").style.display =
"block";

$("app").style.display =
"none";

return;

}


if(
user.email !== ADMIN_EMAIL
){

signOut(auth);

return;

}


$("loginBox").style.display =
"none";


$("app").style.display =
"block";


$("adminEmail").textContent =
user.email;


listenNotifications();

loadProducts();

loadClips();

loadRequests();

}
);



/* =========================
   VIDEO CATEGORY
========================= */

$("vCategory").onchange =
() => {

$("bindBox").style.display =
$("vCategory").value ===
"คลิปโปรโมทสินค้า"
? "block"
: "none";

};



/* =========================
   ADD PRODUCT
========================= */

$("addProductBtn").onclick =
async () => {

const title =
$("pTitle").value.trim();


if(!title){

alert(
"กรุณาใส่ชื่อสินค้า"
);

return;

}


try{

$("addProductBtn").disabled =
true;


await addDoc(
collection(db,"products"),
{

title:title,

description:
$("pDesc").value.trim(),

category:
$("pCategory").value.trim(),

price:
Number(
$("pPrice").value
) || 0,

image:
$("pImage").value.trim(),

video:
$("pVideo").value.trim(),

model3d:
$("pModel").value.trim(),

line:
$("pLine").value.trim(),

facebook:
$("pFacebook").value.trim(),

discord:
$("pDiscord").value.trim(),

createdAt:
serverTimestamp()

}
);



/*
สร้างแจ้งเตือน
*/

await createNotification(
"🛍️ เพิ่มสินค้าใหม่",
title,
"สินค้า"
);



alert(
"เพิ่มสินค้าแล้ว\n🔔 สร้างแจ้งเตือนแล้ว"
);



[
"pTitle",
"pDesc",
"pCategory",
"pPrice",
"pImage",
"pVideo",
"pModel",
"pLine",
"pFacebook",
"pDiscord"
]
.forEach(
id => $(id).value = ""
);


}

catch(error){

alert(
"เพิ่มสินค้าไม่สำเร็จ: "
+
error.message
);

}

finally{

$("addProductBtn").disabled =
false;

}

};



/* =========================
   ADD VIDEO
========================= */

$("addVideoBtn").onclick =
async () => {

const title =
$("vTitle").value.trim();


if(!title){

alert(
"กรุณาใส่ชื่อคลิป"
);

return;

}


const category =
$("vCategory").value;


const productId =
$("vProduct").value;


const product =
products.find(
p => p.id === productId
);



let collectionName;


if(
category ===
"คลิปโปรโมทสินค้า"
){

collectionName =
"productVideos";

}

else if(
category ===
"สื่อการสอน"
){

collectionName =
"videos";

}

else{

collectionName =
"generalVideos";

}



try{

$("addVideoBtn").disabled =
true;


await addDoc(
collection(
db,
collectionName
),
{

title:title,

description:
$("vDesc").value.trim(),

category:category,

url:
$("vUrl").value.trim(),

video:
$("vUrl").value.trim(),

cover:
$("vCover").value.trim(),

productId:
productId || "",

productTitle:
product?.title || "",

productPrice:
product?.price || 0,

createdAt:
serverTimestamp()

}
);



/*
สร้างแจ้งเตือน
*/

await createNotification(
"🎬 เพิ่มคลิปใหม่",
title,
category
);



alert(
"เพิ่มคลิปแล้ว\n🔔 สร้างแจ้งเตือนแล้ว"
);



[
"vTitle",
"vDesc",
"vUrl",
"vCover"
]
.forEach(
id => $(id).value = ""
);


$("vProduct").value =
"";

}

catch(error){

alert(
"เพิ่มคลิปไม่สำเร็จ: "
+
error.message
);

}

finally{

$("addVideoBtn").disabled =
false;

}

};



/* =========================
   LOAD PRODUCTS
========================= */

function loadProducts(){

onSnapshot(

query(
collection(db,"products"),
orderBy(
"createdAt",
"desc"
)
),

snapshot => {

products =
snapshot.docs.map(
d => ({
id:d.id,
...d.data()
})
);



$("productList").innerHTML =
products.length

?

products.map(
p => `

<div class="item">

<span class="badge">

${esc(
p.category ||
"ไม่มีหมวด"
)}

</span>


<h3>
${esc(p.title)}
</h3>


<div class="small">

${esc(
p.description
)}

</div>


<div style="
margin-top:7px;
">

ราคา:
${Number(
p.price || 0
).toLocaleString()}
บาท

</div>


<button
class="danger delProduct"
data-id="${p.id}"
style="margin-top:8px"
>

ลบสินค้า

</button>


</div>

`
)
.join("")

:

`
<div class="small">
ยังไม่มีสินค้า
</div>
`;



$("vProduct").innerHTML =
`
<option value="">
-- เลือกสินค้า --
</option>
`
+
products
.map(
p => `

<option value="${p.id}">

${esc(p.title)}

</option>

`
)
.join("");

}

);

}



/* =========================
   DELETE PRODUCT
========================= */

$("productList").onclick =
async e => {

if(
!e.target.classList
.contains("delProduct")
){

return;

}


const id =
e.target.dataset.id;


if(
!confirm(
"ต้องการลบสินค้านี้หรือไม่?"
)
){

return;

}


try{

await deleteDoc(
doc(
db,
"products",
id
)
);

alert("ลบสินค้าแล้ว");

}

catch(error){

alert(
"ลบสินค้าไม่สำเร็จ: "
+
error.message
);

}

};



/* =========================
   LOAD CLIPS
========================= */

let clips = [];


function loadClips(){

const collections = [
"productVideos",
"videos",
"generalVideos"
];


collections.forEach(
collectionName => {

onSnapshot(

query(
collection(
db,
collectionName
),
orderBy(
"createdAt",
"desc"
)
),

snapshot => {


clips =
clips.filter(
x =>
x.collectionName !==
collectionName
);


snapshot.docs.forEach(
d => {

clips.push({

id:d.id,

collectionName:
collectionName,

...d.data()

});

});


clips.sort(
(a,b) =>
(b.createdAt?.seconds || 0)
-
(a.createdAt?.seconds || 0)
);



$("videoList").innerHTML =
clips.length

?

clips.map(
v => `

<div class="item">

<span class="badge">

${esc(
v.category ||
"คลิป"
)}

</span>


<h3>

${esc(v.title)}

</h3>


<div class="small">

${esc(
v.description
)}

</div>


${
v.productTitle

?

`
<div class="small"
style="margin-top:5px">

🛍️ สินค้า:
${esc(
v.productTitle
)}

</div>
`

: ""

}


<button
class="danger delClip"
data-id="${v.id}"
data-col="${v.collectionName}"
style="margin-top:8px"
>

ลบคลิป

</button>


</div>

`
)
.join("")

:

`
<div class="small">
ยังไม่มีคลิป
</div>
`;

}

);

});

}



/* =========================
   DELETE CLIP
========================= */

$("videoList").onclick =
async e => {

if(
!e.target.classList
.contains("delClip")
){

return;

}


const id =
e.target.dataset.id;


const collectionName =
e.target.dataset.col;


if(
!confirm(
"ต้องการลบคลิปนี้หรือไม่?"
)
){

return;

}


try{

await deleteDoc(
doc(
db,
collectionName,
id
)
);

alert("ลบคลิปแล้ว");

}

catch(error){

alert(
"ลบคลิปไม่สำเร็จ: "
+
error.message
);

}

};



/* =========================
   LOAD REQUESTS
========================= */

function loadRequests(){

onSnapshot(

query(
collection(db,"accessRequests"),
orderBy(
"createdAt",
"desc"
)
),

snapshot => {


const rows =
snapshot.docs.map(
d => ({
id:d.id,
...d.data()
})
);



$("requestList").innerHTML =
rows.length

?

rows.map(
r => `

<div class="item">

<h3>

${esc(
r.email ||
"ไม่ทราบ Gmail"
)}

</h3>


<div class="small">

สถานะ:
<b>
${esc(
r.status ||
"pending"
)}
</b>

</div>


<div style="
margin-top:10px;
display:flex;
gap:7px;
flex-wrap:wrap;
">


<button
class="success approve"
data-id="${r.id}"
>

อนุมัติ

</button>


<button
class="warning deny"
data-id="${r.id}"
>

ปฏิเสธ

</button>


${
r.status === "approved"

?

`
<button
class="danger revoke"
data-id="${r.id}"
>

🚫 ยกเลิกสิทธิ์

</button>
`

: ""

}


</div>

</div>

`
)
.join("")

:

`
<div class="small">
ไม่มีคำขอ
</div>
`;

}

);

}



/* =========================
   REQUEST ACTIONS
========================= */

$("requestList").onclick =
async e => {

const id =
e.target.dataset.id;


if(!id){

return;

}


try{


if(
e.target.classList
.contains("approve")
){

await updateDoc(

doc(
db,
"accessRequests",
id
),

{
status:"approved"
}

);


alert(
"อนุมัติแล้ว"
);

}



if(
e.target.classList
.contains("deny")
){

await updateDoc(

doc(
db,
"accessRequests",
id
),

{
status:"denied"
}

);


alert(
"ปฏิเสธแล้ว"
);

}



if(
e.target.classList
.contains("revoke")
){

await updateDoc(

doc(
db,
"accessRequests",
id
),

{
status:"denied"
}

);


alert(
"ยกเลิกสิทธิ์แล้ว"
);

}


}

catch(error){

"ดำเนินการไม่สำเร็จ: "
+
error.message
);

}

};

</script>
