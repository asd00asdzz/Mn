);

document.getElementById(

/[&<>"']/g,

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[c])
);

}

async () => {

googleBtn.disabled =

auth,

checking.classList.remove(
"hidden"
);

"hidden"
);

}

);

doc(
db,

);
